name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # TODO: Find a way to build all three firmwares in one step,
      # to avoid downloading the toolchain multiple times. This will
      # be way faster if/when <https://github.com/esphome/build-action/pull/100>
      # is accepted
      - name: Build S3
        uses: esphome/build-action@v7
        with:
          yaml-file: deskup-pro-controller.yaml
      - name: Copy S3 firmware and update manifest
        run: |
          BUILD_DIR=.esphome/build/deskup-pro/.pioenvs/deskup-pro

          cp $BUILD_DIR/firmware.factory.bin ./firmware/deskup-pro.factory.bin
          cp $BUILD_DIR/firmware.ota.bin     ./firmware/deskup-pro.ota.bin
          MD5=$(md5sum ./firmware/deskup-pro.ota.bin | awk '{print $1}')
          echo "$MD5" > ./firmware/firmware.md5
          sed -i "s/\"md5\": \"[a-f0-9]*\"/\"md5\": \"$MD5\"/" manifest.json

      - name: Build C3
        uses: esphome/build-action@v7
        with:
          yaml-file: deskup-pro-controller-c3.yaml
      - name: Copy C3 firmware and update manifest
        run: |
          BUILD_DIR=.esphome/build/deskup-pro/.pioenvs/deskup-pro

          cp $BUILD_DIR/firmware.factory.bin ./firmware-c3/deskup-pro.factory.bin
          cp $BUILD_DIR/firmware.ota.bin     ./firmware-c3/deskup-pro.ota.bin
          MD5=$(md5sum ./firmware-c3/deskup-pro.ota.bin | awk '{print $1}')
          echo "$MD5" > ./firmware-c3/firmware.md5
          sed -i "s/\"md5\": \"[a-f0-9]*\"/\"md5\": \"$MD5\"/" manifest-c3.json

      - name: Build C6
        uses: esphome/build-action@v7
        with:
          yaml-file: deskup-pro-controller-c6.yaml
      - name: Copy C6 firmware and update manifest
        run: |
          BUILD_DIR=.esphome/build/deskup-pro/.pioenvs/deskup-pro

          cp $BUILD_DIR/firmware.factory.bin ./firmware-c6/deskup-pro.factory.bin
          cp $BUILD_DIR/firmware.ota.bin     ./firmware-c6/deskup-pro.ota.bin
          MD5=$(md5sum ./firmware-c6/deskup-pro.ota.bin | awk '{print $1}')
          echo "$MD5" > ./firmware-c6/firmware.md5
          sed -i "s/\"md5\": \"[a-f0-9]*\"/\"md5\": \"$MD5\"/" manifest-c6.json

      - name: Commit firmware
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add firmware/ firmware-c3/ firmware-c6/ manifest*.json
          git diff --cached --quiet || git commit -m "chore: update firmware binaries and manifests"
          git push
